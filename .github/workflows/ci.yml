name: CI

# Pull requests are checked by pr-checks.yml, after a maintainer adds the `run-checks` label.
on:
  push:
    branches:
      - main

jobs:
  build-and-test:
    if: "!startsWith(github.event.head_commit.message, 'release: ')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
