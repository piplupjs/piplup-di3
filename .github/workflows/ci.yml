name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  build-and-test:
    if: "github.event_name == 'pull_request' || !startsWith(github.event.head_commit.message, 'release: ')"
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'pnpm'

      - name: Enable Corepack
        run: corepack enable

      - name: Require maintainer approval before running CI
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const pr = github.event.pull_request;
            if (!pr) {
              throw new Error('Pull request data is missing.');
            }

            const reviews = await github.rest.pulls.listReviews({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number,
            });

            const approvedReviews = reviews.data.filter(
              (review) => review.state === 'APPROVED' && review.user?.login,
            );

            for (const review of approvedReviews) {
              const permission = await github.rest.repos.getCollaboratorPermissionLevel({
                owner: context.repo.owner,
                repo: context.repo.repo,
                username: review.user.login,
              });

              if (permission.data.permission === 'admin' || permission.data.permission === 'maintain') {
                core.info(`Maintainer approval found from ${review.user.login}.`);
                return;
              }
            }

            throw new Error(
              'CI for pull requests targeting main only runs after approval by a maintainer.',
            );

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run build
        run: pnpm run build

      - name: Run tests
        run: pnpm run test
